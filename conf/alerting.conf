# Almond Alerting Configuration File
# All alerting is disabled by default. Enable only the services you need.

# =============================================================================
# GLOBAL ALERT ROUTING SETTINGS
# =============================================================================

# Send alerts to Slack webhook
send_alerts_to_slack = false

# Send alerts via Email/SMTP
send_alerts_to_email = false

# Send alerts to ilert
send_alerts_to_ilert = false

# Send alerts to Prometheus Alertmanager
send_alerts_to_prometheus = false

# Send alerts to PagerDuty
send_alerts_to_pagerduty = false

# Send alerts to Opsgenie
send_alerts_to_opsgenie = false

# =============================================================================
# SLACK CONFIGURATION
# =============================================================================

# Slack webhook URL for global alerts
# Get this from your Slack app settings: https://api.slack.com/apps/
# slack_webhook_url = https://hooks.slack.com/services/YOUR/WEBHOOK/URL

# =============================================================================
# EMAIL/SMTP CONFIGURATION
# =============================================================================

# SMTP server URL (format: smtp://host:port or smtps://host:port)
# smtp_url = smtp://mail.example.com:25

# SMTP username (optional, leave blank if not required)
# smtp_username = user@example.com

# SMTP password (optional, leave blank if not required)
# smtp_password = password

# Email sender address
# email_from = monitoring@example.com

# Email recipient address
# email_recipient = ops@example.com

# Email subject line
# email_subject = Almond Monitoring Alert

# =============================================================================
# ILERT CONFIGURATION
# =============================================================================

# ilert webhook URL
# Get this from your ilert API integration
# ilert_webhook_url = https://api.ilert.com/api/v1/events

# ilert API key (optional, for authentication)
# ilert_api_key = your-api-key

# =============================================================================
# PROMETHEUS ALERTMANAGER CONFIGURATION
# =============================================================================

# Prometheus Alertmanager API endpoint
# prometheus_alertmanager_url = http://alertmanager:9093/api/v1/alerts

# =============================================================================
# PAGERDUTY CONFIGURATION
# =============================================================================

# PagerDuty Events API v2 Routing Key
# Get this from your PagerDuty integration settings
# pagerduty_routing_key = your-routing-key

# =============================================================================
# OPSGENIE CONFIGURATION
# =============================================================================

# Opsgenie API Key
# Get this from your Opsgenie API settings
# opsgenie_api_key = your-api-key

# Opsgenie priority mapping for warning state (status code 1)
# Options: 1=P1, 2=P2, 3=P3 (default: 2)
# opsgenie_p2_priority = 2

# Opsgenie priority mapping for critical state (status code 2/3)
# Options: 4=P4, 5=P5 (default: 5)
# opsgenie_p5_priority = 5

# =============================================================================
# PER-CHECK ALERT ROUTING
# =============================================================================
# You can override global settings for specific checks using the format:
# check.{check_id}.{option} = value
#
# Example: Configure check #5 to send Slack alerts to a different webhook
#
# check.5.enabled = true
# check.5.slack_webhook_url = https://hooks.slack.com/services/DIFFERENT/WEBHOOK/URL
# check.5.email_recipient = specific-ops@example.com
# check.5.pagerduty_routing_key = different-routing-key
# 
# Available per-check options:
#   - enabled (true/false)
#   - slack_webhook_url
#   - smtp_url
#   - smtp_username
#   - smtp_password
#   - email_from
#   - email_recipient
#   - email_subject
#   - ilert_api_key
#   - ilert_webhook_url
#   - prometheus_alertmanager_url
#   - pagerduty_routing_key
#   - opsgenie_api_key
#   - opsgenie_p2_priority
#   - opsgenie_p5_priority

# Example per-check configuration (all disabled):
# check.0.enabled = false
# check.0.slack_webhook_url = https://hooks.slack.com/services/TEAM1/WEBHOOK/URL
# check.0.email_recipient = team1-alerts@example.com

# =============================================================================
# ALERT BEHAVIOR
# =============================================================================
# Alerts are only sent when a check's status changes (state transition).
# Each integration tracks its own send status to avoid duplicate notifications.
# 
# Severity mapping by status code:
#   - Status 0: OK/Normal (lowest priority)
#   - Status 1: WARNING (medium priority)
#   - Status 2: CRITICAL (high priority)
#   - Status 3: UNKNOWN (high priority)
#
# PagerDuty severity mapping:
#   - Status 0 → "info"
#   - Status 1 → "warning"
#   - Status 2+ → "critical"
#
# Opsgenie priority mapping:
#   - Status 0 → P5 (lowest)
#   - Status 1 → P2 (configurable via opsgenie_p2_priority)
#   - Status 2+ → P5 or P4 (configurable via opsgenie_p5_priority)
#   - Closing active alert → P4

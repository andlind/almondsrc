# =============================================================================
# Almond Proxy Alert Configuration
# =============================================================================
# 
# PURPOSE: Fallback alerting for HowRU proxy mode when native C program
#          alerting is unavailable due to network restrictions, DMZ rules,
#          or containerized deployments.
#
# WHEN TO USE:
#   Use alerting.conf (C program):  Direct monitoring with Almond on the host
#   Use proxyalert.conf (HowRU):    Aggregated proxy with remote data sources
#
# ENABLING:
#   Set api.useProxyAlerting=true in /etc/almond/api.conf or almond.conf
#   Default: false (no interference with C program alerting)
#
# DESIGN:
#   - Completely separate from C program alerting
#   - Only active in multi_server/proxy mode
#   - Tracks alert state to prevent spam during polling cycles
#   - Per-server/check override routing for multi-tenant scenarios
#
# =============================================================================

# Global alert routing toggles
send_alerts_to_slack = false
send_alerts_to_email = false
send_alerts_to_ilert = false
send_alerts_to_prometheus = false
send_alerts_to_pagerduty = false
send_alerts_to_opsgenie = false

# Global Slack webhook URL
# slack_webhook_url = https://hooks.slack.com/services/YOUR/WEBHOOK/URL

# Global SMTP delivery settings
# smtp_url = smtp://mail.example.com:25
# smtp_username = user@example.com
# smtp_password = password
# email_from = monitoring@example.com
# email_recipient = ops@example.com
# email_subject = Almond Monitoring Alert

# Global external integrations
# ilert_webhook_url = https://api.ilert.com/api/v1/events
# ilert_api_key = your-api-key
# prometheus_alertmanager_url = http://alertmanager:9093/api/v1/alerts
# pagerduty_routing_key = your-routing-key
# opsgenie_api_key = your-api-key
# opsgenie_p2_priority = 2
# opsgenie_p5_priority = 5

# Per-check overrides for a proxy environment.
# The important part is that the route is scoped by server name, because a proxy can have
# hundreds of hosts with many checks each. Never rely on a global numeric check index.
#
# Supported patterns:
#   server.<servername>.check.<check_number>.<option> = value
#   server.<servername>.check_<check_name>.<option> = value
#
# Legacy single-host config keys are still accepted as a compatibility fallback, but they do
# not work reliably for a multi-server proxy layout.
#
# =============================================================================
# REAL-WORLD EXAMPLE: Three-tier infrastructure
# =============================================================================
#
# Configuration for a multi-server proxy monitoring web servers, databases, and cache:
#
# 1. Web tier (web-01, web-02): global Slack alerts + per-server overrides
# server.web-01.check.0.enabled = true
# server.web-01.check.0.slack_webhook_url = https://hooks.slack.com/services/TEAM-WEB/WEBHOOK/URL
# server.web-01.check_cpu.email_recipient = web-team@example.com
#
# server.web-02.check_http.pagerduty_routing_key = web-pd-routing-key
# server.web-02.check_memory.slack_webhook_url = https://hooks.slack.com/services/TEAM-WEB/WEBHOOK/URL
#
# 2. Database tier (db-01, db-02): separate critical alerts to database team
# server.db-01.check.0.enabled = true
# server.db-01.check.0.email_recipient = db-critical@example.com
# server.db-01.check_disk.email_recipient = db-storage-alerts@example.com
# server.db-01.check_disk.pagerduty_routing_key = db-pd-critical-key
#
# server.db-02.check_replication.email_recipient = db-ops@example.com
# server.db-02.check_replication.slack_webhook_url = https://hooks.slack.com/services/TEAM-DB/WEBHOOK/URL
# server.db-02.check_replication.opsgenie_api_key = db-specific-opsgenie-key
#
# 3. Cache tier (cache-01): route via ilert and Alertmanager
# server.cache-01.check_memory.ilert_webhook_url = https://api.ilert.com/api/v1/events
# server.cache-01.check_memory.ilert_api_key = cache-ilert-key
# server.cache-01.check_eviction.prometheus_alertmanager_url = http://alertmanager:9093/api/v1/alerts
#
# Notes:
# - Global defaults (send_alerts_to_slack = true, etc.) apply to all servers
# - Per-server/check overrides allow team-specific routing without duplicating global config
# - A single check can target multiple services simultaneously if needed
# - Status code 0 (OK) recoveries are sent to the same route as the alert
